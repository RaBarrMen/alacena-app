name: alacena_app
description: Inventario doméstico (alacena) con persistencia local.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  table_calendar: ^3.1.3
  badges: ^3.1.2
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
